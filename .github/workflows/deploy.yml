name: UniSphere Continuous Deployment (CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: SSH ile Sunucuya Baglan ve Deploy Et
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            echo "--- DAGITIM BASLADI ---"

            cd ~/UniSphere || exit 1

            echo "1. Mevcut branch:"
            git branch --show-current

            echo "2. GitHub'dan en guncel kodlar cekiliyor..."
            git fetch --all
            git reset --hard origin/main

            echo "3. Guncel commit:"
            git log --oneline -n 1

            echo "4. GitHub Secrets -> VPS .env dosyasi yaziliyor..."
            POSTGRES_USER_VALUE="${{ secrets.POSTGRES_USER }}"
            POSTGRES_PASSWORD_VALUE="${{ secrets.POSTGRES_PASSWORD }}"
            POSTGRES_DB_VALUE="${{ secrets.POSTGRES_DB }}"
            JWT_KEY_VALUE="${{ secrets.JWT_KEY }}"
            JWT_ISSUER_VALUE="${{ secrets.JWT_ISSUER }}"
            JWT_AUDIENCE_VALUE="${{ secrets.JWT_AUDIENCE }}"
            JWT_EXPIRE_MINUTES_VALUE="${{ secrets.JWT_EXPIRE_MINUTES }}"

            cat > .env <<EOF
            POSTGRES_USER=${POSTGRES_USER_VALUE:-postgres}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD_VALUE:-03042026Van!}
            POSTGRES_DB=${POSTGRES_DB_VALUE:-unisphere}
            JWT_KEY=${JWT_KEY_VALUE:-BuCokGizliVeUzunBirSifreOlmali123456!}
            JWT_ISSUER=${JWT_ISSUER_VALUE:-UniSphereAPI}
            JWT_AUDIENCE=${JWT_AUDIENCE_VALUE:-UniSphereUsers}
            JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES_VALUE:-60}
            ASPNETCORE_ENVIRONMENT=Production
            EOF

            echo "5. Docker Compose config dogrulaniyor..."
            docker compose config >/tmp/unisphere-compose-config.yml

            echo "6. Image'lar build ediliyor..."
            docker compose build db unisphere_api frontend

            echo "7. Servisler dependency sirasiyla ayaga kaldiriliyor..."
            docker compose up -d db
            docker compose up -d unisphere_api
            docker compose up -d frontend

            echo "8. Backend saglik kontrolu bekleniyor..."
            for i in $(seq 1 30); do
              if docker compose ps unisphere_api | grep -q "healthy"; then
                echo "Backend healthy."
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "Backend healthy durumuna gecemedi. Son loglar:"
                docker compose logs --tail=120 unisphere_api || true
                exit 1
              fi

              sleep 5
            done

            echo "9. Frontend Nginx /api proxy kontrolu..."
            docker compose exec -T frontend wget -qO- http://localhost/api/Event >/tmp/unisphere-api-proxy-check.txt || {
              echo "Frontend Nginx /api proxy backend'e ulasamiyor. Son loglar:"
              docker compose logs --tail=80 frontend || true
              docker compose logs --tail=120 unisphere_api || true
              exit 1
            }

            echo "10. Orphan / kullanilmayan container temizligi..."
            docker container prune -f

            echo "11. Konteyner durumlari:"
            docker ps

            echo "12. Frontend loglari:"
            docker compose logs --tail=30 frontend || true

            echo "13. Backend loglari:"
            docker compose logs --tail=30 unisphere_api || true

            echo "14. Kullanilmayan image temizligi:"
            docker image prune -f

            echo "--- DAGITIM BASARIYLA TAMAMLANDI ---"
